version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: transcript-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    # GPU support (uncomment if you have GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build: .
    container_name: transcript-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL_NAME=mistral:latest
    depends_on:
      - ollama
    command: python app.py
    volumes:
      - ./app.py:/app/app.py

volumes:
  ollama-data:
